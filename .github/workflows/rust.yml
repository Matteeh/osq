name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format, clippy and test
        run: sh scripts/verify-rust.sh
