name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format, clippy and test
        run: sh scripts/verify-rust.sh

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked

      - name: Mutate the diff of this push or pull request
        if: github.event_name != 'schedule'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff "$BASE_SHA" HEAD > "$RUNNER_TEMP/rust-diff.patch"
          sh scripts/mutants-rust.sh "$RUNNER_TEMP/rust-diff.patch"

      - name: Mutate the whole workspace
        if: github.event_name == 'schedule'
        run: sh scripts/mutants-rust.sh
