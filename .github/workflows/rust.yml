name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format, clippy and test
        run: sh scripts/verify-rust.sh

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked

      - name: Mutate the diff of this push or pull request
        if: github.event_name != 'schedule'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff "$BASE_SHA" HEAD > "$RUNNER_TEMP/rust-diff.patch"
          sh scripts/mutants-rust.sh "$RUNNER_TEMP/rust-diff.patch"

      - name: Mutate the whole workspace
        if: github.event_name == 'schedule'
        run: sh scripts/mutants-rust.sh

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the parity tests
        run: cargo clippy -p osq-kernel-specs --features parity --all-targets -- -D warnings

      - name: Run the parity tests against the pinned OpenSpec
        if: github.event_name != 'schedule'
        run: cargo test -p osq-kernel-specs --features parity --test openspec_validate_parity_corpus --test openspec_archive_parity_corpus -- --include-ignored

      - name: Install latest OpenSpec outside the lockfile
        if: github.event_name == 'schedule'
        run: npm install --prefix "$RUNNER_TEMP/openspec-latest" @fission-ai/openspec@latest

      - name: Run the parity tests against the latest OpenSpec
        if: github.event_name == 'schedule'
        env:
          OSQ_OPENSPEC_BIN: ${{ runner.temp }}/openspec-latest/node_modules/.bin/openspec
          OPENSPEC_TELEMETRY: '0'
        run: cargo test -p osq-kernel-specs --features parity --test openspec_validate_parity_corpus --test openspec_archive_parity_corpus -- --include-ignored
