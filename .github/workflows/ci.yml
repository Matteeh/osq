name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification gate
        run: pnpm verify

      - name: OpenCode binary smoke check
        if: env.OPENCODE_SKIP_REAL != '1'
        run: |
          if command -v opencode >/dev/null 2>&1; then
            opencode --version
          else
            echo "OpenCode binary not present on runner; skipping smoke check"
          fi
