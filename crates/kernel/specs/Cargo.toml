[package]
name = "osq-kernel-specs"
description = "Specs adapter: parses, validates and merges living specs, proposals, task files and delta specs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
osq-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
yaml-rust2.workspace = true

# The OpenSpec parity tests run the Node CLI, so they build only with `parity`
# (rust-core "Corpus tests"). `scripts/verify-rust.sh` does not build them.
[features]
parity = []

[[test]]
name = "openspec_validate_parity_corpus"
required-features = ["parity"]

[[test]]
name = "openspec_archive_parity_corpus"
required-features = ["parity"]
